name: Actualizar tipos de cambio bancarios

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Consultar sin modificar los CSV ni hacer commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    name: actualizar y guardar cotizaciones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar cotizaciones
        id: actualizar
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./datos/bancos/update_bancos.py --dry-run
          else
            ./datos/bancos/update_bancos.py
          fi

      - name: Guardar datos disponibles
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config --global user.email "dolares-bot@example.com"
          git config --global user.name "dolares-bot"
          git add datos/bancos/compra.csv datos/bancos/venta.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[ci] update bancos"
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push -q origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 2))
          done
          exit 1

      - name: Reportar fallos
        if: steps.actualizar.outcome == 'failure'
        run: exit 1
